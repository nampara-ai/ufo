[package]
name = "ufo-spike-kernel"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[features]
conformance = [] # adds the exports spike/tools/conformance.mjs calls

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
