<h1>07 naive: the stream handed to a Response</h1>
<p>Naive: the inflating stream is handed to a Response and read whole. The page catches the failure; Firefox writes it to the console all the same.</p>
<p>Result: <span id="result">not finished</span></p>

<script type="module">const violations = []; document.addEventListener('securitypolicyviolation', e => violations.push(e.violatedDirective + ' ' + e.blockedURI));
const finish = (problems = [], wait = 400) => setTimeout(() => { const all = [...problems, ...violations.map(v => 'policy violation: ' + v)];
  document.getElementById('result').textContent = document.documentElement.dataset.result = all.length ? 'fail: ' + all.join('; ') : 'pass'; }, wait);
const problems = [];
// six bytes that are no DEFLATE stream; a page that inflates what a file carries must expect them
const bad = new Uint8Array([255, 255, 255, 255, 255, 255]), through = () => new Blob([bad]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
const inflate = async () => new Uint8Array(await new Response(through()).arrayBuffer());
const got = await inflate().then(b => b, () => null);
if (got !== null) problems.push('bytes that do not inflate were taken as ' + got.length + ' bytes');
finish(problems, 800);</script></body></html>
